<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Welcome - Utility Suite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-container">
    <!-- Glowing Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="welcome-screen">
      <!-- Animated 3D Graphic -->
      <div class="welcome-content">
        <div class="floating-hero-box">
          <div class="hero-glass-disc">⚡</div>
          <div class="float-chip chip-1">✨ Fast</div>
          <div class="float-chip chip-2">📱 Mobile</div>
        </div>

        <h1 class="welcome-title">Utility Suite</h1>
        <p class="welcome-subtitle">
          Professional micro-calculator suite built with live inline analytics.
        </p>
      </div>

      <!-- Feature Cards -->
      <div class="glass-features">
        <div class="glass-feature-card">
          <div class="glass-icon">📊</div>
          <div>
            <h4 style="font-size: 0.9rem; font-weight: 700;">Live Canvas Results</h4>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Instant calculations displayed on page</p>
          </div>
        </div>

        <div class="glass-feature-card">
          <div class="glass-icon">🎨</div>
          <div>
            <h4 style="font-size: 0.9rem; font-weight: 700;">Clean Interface</h4>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Zero annoying pop-ups or alerts</p>
          </div>
        </div>
      </div>

      <!-- Launch Action -->
      <div>
        <a href="index.html" class="btn-start">
          Launch Application &rarr;
        </a>
      </div>
    </div>
  </div>

</body>
</html>

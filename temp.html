<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-container">
    <div class="orb orb-1"></div>

    <div class="top-bar">
      <a href="index.html" class="back-btn">← Home</a>
      <span class="page-title">Temperature</span>
      <span style="width: 40px;"></span>
    </div>

    <div class="content">
      <div class="card">
        <div class="form-group">
          <label>Celsius Temperature (°C)</label>
          <input type="number" id="celsius" class="input-field" placeholder="0°C">
        </div>
        <button class="btn-start" onclick="calcTemp()">▶ Convert Temperature</button>
      </div>

      <div id="canvas-card" class="canvas-result">
        <div class="canvas-header">
          <span style="font-size: 0.85rem; font-weight: 700;">Conversion Output</span>
          <span class="canvas-badge">Active Result</span>
        </div>
        <div class="result-row"><span class="result-label">Celsius Input</span><span class="result-val" id="val-cel">-</span></div>
        <div class="result-row"><span class="result-label">Fahrenheit Output</span><span class="result-val" id="val-fah" style="color: #F59E0B;">-</span></div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-link">Hub</a>
      <a href="mdas.html" class="nav-link">MDAS</a>
      <a href="age.html" class="nav-link">Age</a>
      <a href="circle.html" class="nav-link">Circle</a>
      <a href="temp.html" class="nav-link active">Temp</a>
      <a href="grade.html" class="nav-link">Grade</a>
    </nav>
  </div>

  <script>
    function calcTemp() {
      let c = parseFloat(document.getElementById('celsius').value);
      if (isNaN(c)) return;

      let f = (c * 9/5) + 32;

      document.getElementById('val-cel').textContent = `${c}°C`;
      document.getElementById('val-fah').textContent = `${f.toFixed(2)}°F`;
      
      let card = document.getElementById('canvas-card');
      card.classList.remove('active');
      void card.offsetWidth;
      card.classList.add('active');

      console.log("Temp Result:", { celsius: c, fahrenheit: f });
    }
  </script>
</body>
</html>
